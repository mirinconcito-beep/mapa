// Prolongar Justo Sierra desde Puerto Seco.
(() => {
  const svgNS = 'http://www.w3.org/2000/svg';

  function agregar(svg, etiqueta, atributos, contenido) {
    const elemento = document.createElementNS(
      svgNS,
      etiqueta
    );

    Object.entries(atributos).forEach(([clave, valor]) => {
      elemento.setAttribute(clave, valor);
    });

    if (contenido) elemento.textContent = contenido;

    svg.append(elemento);
    return elemento;
  }

  // Croquis del recorrido animado.
  const mapa = $('#map');
  const calles = document.createElementNS(svgNS, 'g');

  agregar(calles, 'path', {
    class: 'edge',
    d: 'M 780 545 V 850'
  });

  agregar(calles, 'path', {
    class: 'road',
    d: 'M 780 545 V 850'
  });

  mapa.insertBefore(calles, $('#routePath'));

  agregar(mapa, 'text', {
    x: '812',
    y: '625',
    transform: 'rotate(90 812 625)',
    style: 'font-size:23px;stroke-width:6'
  }, 'Justo Sierra');

  agregar(mapa, 'text', {
    x: '760',
    y: '885',
    'text-anchor': 'end',
    style: 'font-size:23px;stroke-width:6'
  }, 'Puerto Seco');

  mapa.setAttribute(
    'aria-label',
    'Croquis de cinco rutas hacia Mi RinconcITO'
  );

  // Croquis general.
  const general = $('#overview-map');
  const extension = document.createElementNS(svgNS, 'g');

  agregar(extension, 'path', {
    d: 'M 780 765 V 1070',
    fill: 'none',
    stroke: '#cad1bd',
    'stroke-width': '28'
  });

  agregar(extension, 'path', {
    d: 'M 780 765 V 1070',
    fill: 'none',
    stroke: '#fffdf2',
    'stroke-width': '22'
  });

  general.insertBefore(extension, $('#overview-routes'));

  agregar(general, 'text', {
    x: '815',
    y: '827',
    transform: 'rotate(90 815 827)',
    style: 'font-size:27px;stroke:#fffdf2;stroke-width:8'

  agregar(general, 'text', {
    x: '910',
    y: '1110',
    'text-anchor': 'middle',
    style: 'font-size:35px;fill:#174f48;stroke-width:8'
  }, 'Puerto Seco');

  agregar(general, 'text', {
    x: '910',
    y: '1150',
    'text-anchor': 'middle',
    style: 'font-size:21px;stroke-width:6'
  }, 'Carretera de');

let selected='acatlan',steps=[],step=0,run=0,playing=false,paused=false,raf=0,startTime=0,elapsed=0,duration=0,utterance=null,voiceDone=false,pathDone=false,resumeOnReturn=false;
const motion=document.createElementNS('http://www.w3.org/2000/svg','path');motion.id='motion';motion.style.display='none';$('#map').append(motion);
function showScreen(id){if(id==='entrance-screen')renderOverview();document.querySelectorAll('.screen').forEach(s=>s.hidden=s.id!==id);window.scrollTo(0,0)}
function speak(text,token){voiceDone=!$('#voice').checked||!('speechSynthesis'in window);if(voiceDone)return;utterance=new SpeechSynthesisUtterance(text);utterance.lang='es-MX';const voices=speechSynthesis.getVoices();utterance.voice=voices.find(v=>v.lang==='es-MX')||voices.find(v=>v.lang.startsWith('es'))||null;utterance.rate=.94;utterance.onend=utterance.onerror=()=>{if(token===run){voiceDone=true;advance(token)}};speechSynthesis.speak(utterance)}
function stop(){run++;cancelAnimationFrame(raf);if('speechSynthesis'in window)speechSynthesis.cancel();playing=false;paused=false;resumeOnReturn=false;$('#pause').disabled=true;$('#pause').textContent='Pausar'}
function preview(){steps=[...routes[selected].steps,...common];$('#routePath').setAttribute('d',routes[selected].steps.map(s=>s.d).join(' '));$('#routePath').setAttribute('stroke',routes[selected].color);const p=$('#routePath').getPointAtLength(0);$('#traveler').setAttribute('transform',`translate(${p.x} ${p.y})`);$('#bar').style.width='0%';$('#map').setAttribute('viewBox','0 0 840 900')}
function advance(token){if(token!==run||!playing||paused||!voiceDone||!pathDone)return;step++;if(step>=steps.length){playing=false;$('#pause').disabled=true;return}next(token)}
function tick(now){if(!playing||paused)return;const t=Math.min((now-startTime)/duration,1);const p=motion.getPointAtLength(motion.getTotalLength()*t);$('#traveler').setAttribute('transform',`translate(${p.x} ${p.y})`);$('#bar').style.width=((step+t)/steps.length*100)+'%';elapsed=now-startTime;if(t<1)raf=requestAnimationFrame(tick);else{pathDone=true;advance(run)}}
function next(token){pathDone=false;voiceDone=false;elapsed=0;motion.setAttribute('d',steps[step].d);$('#caption').textContent=steps[step].text;$('#map').setAttribute('viewBox',step>=routes[selected].steps.length?'300 500 430 345':'0 0 840 900');duration=Math.max(4500,steps[step].text.length*58);speak(steps[step].text,token);startTime=performance.now();raf=requestAnimationFrame(tick)}
function start(){stop();showScreen('map-screen');preview();step=0;playing=true;$('#pause').disabled=false;next(run)}
function togglePause(){if(!playing)return;paused=!paused;$('#pause').textContent=paused?'Continuar':'Pausar';if(paused){cancelAnimationFrame(raf);if('speechSynthesis'in window)speechSynthesis.pause()}else{if('speechSynthesis'in window)speechSynthesis.resume();startTime=performance.now()-elapsed;if(pathDone)advance(run);else raf=requestAnimationFrame(tick)}}

function overviewPath(d){return d.replace(/([A-Za-z])|(-?\d+(?:\.\d+)?)/g,(()=>{let command='',index=0;return (all,cmd,num)=>{if(cmd){command=cmd;index=0;return cmd}const isY=command==='V'||(['M','L','Q','C','S','T'].includes(command)&&index%2===1);index++;return isY&&Number(num)>=500?String(Number(num)+220):num}})())}
function renderOverview(){const group=$('#overview-routes');group.replaceChildren();Object.values(routes).forEach(route=>{const line=document.createElementNS('http://www.w3.org/2000/svg','path');line.setAttribute('d',overviewPath(route.steps.map(s=>s.d).join(' ')));line.setAttribute('stroke',route.color);line.setAttribute('fill','none');line.setAttribute('stroke-width','11');line.setAttribute('stroke-linecap','round');line.setAttribute('stroke-linejoin','round');group.append(line)})}
$('#expand-overview').onclick=()=>{const clone=$('#overview-map').cloneNode(true);clone.removeAttribute('id');clone.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));$('#large-overview').replaceChildren(clone);$('#overview-dialog').showModal()};
